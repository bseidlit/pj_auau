  common:
    wr_cogx_bound: 2.0
    cluster_weta_cogx_bound: 2.0

    prob_max: 1.0
    prob_min: 0.0

    e11_over_e33_max: 0.98
    e11_over_e33_min: 0.0

    e32_over_e35_max: 1.0
    e32_over_e35_min: 0.8

